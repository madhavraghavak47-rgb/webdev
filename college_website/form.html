<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Form - GCET Jammu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a class="brand" href="index.html">
                <img src="images/logo.svg" alt="GCET Jammu Logo">
                <span>GCET Jammu</span>
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="faculty.html">Faculty</a></li>
                    <li><a href="students.html">Students</a></li>
                    <li><a href="gallery.html">Photo Gallery</a></li>
                    <li><a href="form.html" class="active">Admission Form</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-heading">
            <h1>Student Admission Form</h1>
            <p>Enter your details below.</p>
        </section>

        <form class="admission-form" action="#" method="post">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" name="mobile" required>
            </div>

            <fieldset>
                <legend>Gender</legend>
                <label><input type="radio" name="gender" value="male" required> Male</label>
                <label><input type="radio" name="gender" value="female"> Female</label>
                <label><input type="radio" name="gender" value="other"> Other</label>
            </fieldset>

            <div class="form-group">
                <label for="course">Course</label>
                <select id="course" name="course" required>
                    <option value="">Select Course</option>
                    <option value="cse">Computer Science</option>
                    <option value="ee">Electrical Engineering</option>
                    <option value="ece">Electronics &amp; Communication</option>
                    <option value="me">Mechanical Engineering</option>
                </select>
            </div>

            <fieldset>
                <legend>Hobbies</legend>
                <label><input type="checkbox" name="hobbies" value="sports"> Sports</label>
                <label><input type="checkbox" name="hobbies" value="music"> Music</label>
                <label><input type="checkbox" name="hobbies" value="reading"> Reading</label>
                <label><input type="checkbox" name="hobbies" value="coding"> Coding</label>
            </fieldset>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="4" required></textarea>
            </div>

            <div class="form-buttons">
                <button type="submit">Submit</button>
                <button type="reset" class="reset-btn">Reset</button>
            </div>
        </form>
    </main>

    <footer>
        <p><strong>GCET Jammu</strong> | Student Admission</p>
    </footer>
</body>
</html>
