<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery - GCET Jammu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a class="brand" href="index.html">
                <img src="images/logo.svg" alt="GCET Jammu Logo">
                <span>GCET Jammu</span>
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="faculty.html">Faculty</a></li>
                    <li><a href="students.html">Students</a></li>
                    <li><a href="gallery.html" class="active">Photo Gallery</a></li>
                    <li><a href="form.html">Admission Form</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-heading">
            <h1>Campus Photo Gallery</h1>
            <p>Explore our campus, facilities and college activities.</p>
        </section>

        <section class="gallery-grid">
            <figure>
                <img src="images/college.jpg" alt="College campus">
                <figcaption>College Campus</figcaption>
            </figure>
            <figure>
                <img src="images/college2.png" alt="College building">
                <figcaption>College Building</figcaption>
            </figure>
            <figure>
                <img src="images/college3.png" alt="College campus view">
                <figcaption>Campus View</figcaption>
            </figure>
            <figure>
                <img src="images/library.jpg" alt="College library">
                <figcaption>College Library</figcaption>
            </figure>
            <figure>
                <img src="images/seminar.jpg" alt="College seminar">
                <figcaption>Seminar</figcaption>
            </figure>
            <figure>
                <img src="images/ground.jpg" alt="College ground">
                <figcaption>College Ground</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p><strong>GCET Jammu</strong> | Photo Gallery</p>
    </footer>

</html>
